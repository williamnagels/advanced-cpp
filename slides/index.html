<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Advanced C++ Training Slides</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      color: #202124;
      background: #f5f3ed;
    }
    body {
      max-width: 52rem;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 8vw, 4.5rem);
      line-height: 1;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 3rem;
      color: #55524b;
      font: 1.1rem/1.6 "Trebuchet MS", sans-serif;
    }
    ul {
      margin: 0;
      padding: 0;
      border-top: 2px solid #202124;
      list-style: none;
    }
    li {
      border-bottom: 1px solid #aaa69c;
    }
    a {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 0;
      color: inherit;
      font-size: 1.35rem;
      text-decoration: none;
    }
    a::after {
      content: "Download PDF";
      color: #a33b20;
      font: 0.9rem/1.8 "Trebuchet MS", sans-serif;
      white-space: nowrap;
    }
    a:hover,
    a:focus-visible {
      color: #a33b20;
    }
    @media (max-width: 32rem) {
      body { padding-top: 2.5rem; }
      a { align-items: baseline; font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Advanced C++</h1>
    <p>Training slide decks, generated from the latest revision of the main branch.</p>
    <ul>
      <li><a href="1_intro.pdf">Introduction</a></li>
      <li><a href="2_ranges.pdf">Ranges</a></li>
      <li><a href="3_coroutines.pdf">Coroutines</a></li>
    </ul>
  </main>
</body>
</html>
