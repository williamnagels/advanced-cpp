# .github/workflows/build.yml

name: Docker build

# Trigger the workflow on push or pull request events to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Enables manual triggering
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up Docker Buildx (optional but recommended for better Docker build performance)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Build the Docker container
      - name: Build Docker Container
        run: |
          docker build -t trainingcontainer docker/

      # Step 4: Build CMake Project in compilertest
      - name: Build CMake Project - compilertest
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            trainingcontainer /bin/sh -c  "cd /workspace/compilertest && mkdir -p build && cd build && cmake .. && make"

      # Step 5: Build CMake Project in exercises/
      - name: Build CMake Project - exercises
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            trainingcontainer /bin/sh -c "cd /workspace/exercises && mkdir -p build && cd build && cmake .. && make"

      - name: Generate slide PDFs
        run: |
          mkdir -p slides/artifacts
          for deck in 1_intro.md 2_ranges.md 3_coroutines.md; do
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --env HOME=/tmp \
              --env TMPDIR=/tmp \
              --mount type=bind,source="$PWD/slides",target=/slides \
              --workdir /slides \
              trainingcontainer \
              ./generate.sh "$deck" artifacts
          done

      - name: Publish slide PDFs
        uses: actions/upload-artifact@v4
        with:
          name: advanced-cpp-slides
          path: |
            slides/artifacts/1_intro.pdf
            slides/artifacts/2_ranges.pdf
            slides/artifacts/3_coroutines.pdf
          if-no-files-found: error
          retention-days: 30